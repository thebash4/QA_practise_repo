[pytest]
# Add the repo root to the import path so tests can import shared helpers like api_utils.
pythonpath = .

# Save API test results on every run: XML for CI, HTML for people.
addopts = --junitxml=reports/api-results.xml --html=reports/api-report.html --self-contained-html

# Capture INFO-level request/response logs for each test (polling calls log at DEBUG and stay hidden).
log_level = INFO
